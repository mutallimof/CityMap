<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5E6E" />
    <meta name="description" content="An animated map of Istanbul: ferries on the water, places and events from open data, live weather." />
    <meta property="og:title" content="Livin&#39; Istanbul" />
    <meta property="og:description" content="An animated map of Istanbul: ferries on the water, places and events from open data, live weather." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Livin&#39; Istanbul" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <title>Livin' Istanbul</title>
    <script>
      // The look to paint the loading screen in, before any script loads: ?theme=, saved choice, else the
      // default (keep in sync with DEFAULT_THEME in src/themes/registry.ts).
      try {
        document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme:v1') || 'toy';
      } catch (e) {
        document.documentElement.dataset.theme = 'toy';
      }
    </script>
  </head>
  <body>
    <div id="map"></div>
    <div id="ui"></div>
    <div id="loader" role="status" aria-live="polite">
      <img class="loader__mark" src="/wordmark.svg" alt="Livin' Istanbul" width="236" height="48" />
      <div class="loader__scene">
        <div class="loader__line"></div>
        <svg class="loader__boat" viewBox="0 0 64 32" aria-hidden="true">
          <path d="M4 20h56l-6 8H10z" fill="#fff" />
          <path d="M6 23h52l-4 5H10z" fill="#2A2E35" />
          <rect x="14" y="13" width="34" height="7" rx="2" fill="#fff" />
          <rect x="16" y="15" width="30" height="2.4" fill="#34404C" />
          <rect x="30" y="4" width="5" height="9" fill="#E8B22E" />
          <rect x="30" y="4" width="5" height="2.5" fill="#1E1F22" />
        </svg>
      </div>
      <p class="loader__text"><span lang="tr">İstanbul uyanıyor…</span><br /><span lang="en">İstanbul is waking up…</span></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
