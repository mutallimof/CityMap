name: Deploy phase-0 to GitHub Pages

on:
  push:
    branches: [phase-0]
  workflow_dispatch:
  # Called by the data refresh job after it commits new data (pushes made with GITHUB_TOKEN
  # don't trigger other workflows, so it deploys explicitly).
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # validate:routes + validate:timetables + typecheck + vite build; the base path (/CityMap/) comes from site.json
      - run: npm run build
      - run: touch dist/.nojekyll
      # Pages serves the gh-pages branch (Settings → Pages → Deploy from a branch: gh-pages / root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true

