name: Deploy phase-0 to GitHub Pages

on:
  push:
    branches: [phase-0]
  workflow_dispatch:
  # Called by the data refresh job after it commits new data (pushes made with GITHUB_TOKEN
  # don't trigger other workflows, so it deploys explicitly).
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # validate:routes + typecheck + vite build; Pages serves the site under /<repo>/
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Also publish the build to the gh-pages branch, so Pages works with either source setting
      # ("GitHub Actions" or "Deploy from a branch: gh-pages / root").
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Fails harmlessly until Pages' source is set to "GitHub Actions".
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
