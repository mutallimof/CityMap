# Refreshes the static data the site ships with, then builds and deploys:
#   - events: every day (venue scrapers, facts only, polite; see scripts/events)
#   - stories: once a month (OSM + Wikidata + Wikipedia + Commons; see scripts/stories)
#   - ferry timetables: checked every run (validate:data); a warning in the run summary from 30 days
#     before the timetable ends (it comes from the operator's PDF by hand — scripts/timetables/README.md)
#   - private ferry operators (Turyol, Dentur Avrasya; scripts/operators): read once a week (the script skips
#     until 6 days have passed since its last read; what=operators forces a read now)
# Data is validated first; nothing is committed or deployed when it's empty or broken.
name: Refresh data (events daily, stories monthly)

on:
  schedule:
    - cron: '17 3 * * *' # 06:17 Istanbul — events
    - cron: '43 2 3 * *' # 3rd of each month 05:43 Istanbul — stories
  workflow_dispatch:
    inputs:
      what:
        description: events, stories, places (auto-featured), operators (ferry timetables, re-read now) or both (= all)
        default: both
      venues:
        description: only these venue ids, comma-separated (re-fetches them today; for fixing a scraper)
        default: ''

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Decide what to refresh
        id: what
        run: |
          W="${{ github.event.inputs.what }}"
          if [ -z "$W" ]; then
            if [ "${{ github.event.schedule }}" = "43 2 3 * *" ]; then W=stories,places; else W=events; fi
          fi
          echo "what=$W" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $W"
      - name: Scrape venue events
        if: contains(steps.what.outputs.what, 'events') || steps.what.outputs.what == 'both'
        run: npm run data:events
        continue-on-error: true
        env:
          VENUES: ${{ github.event.inputs.venues }}
          FORCE: ${{ github.event.inputs.venues != '' && '1' || '' }}
      - name: Pick featured places
        if: contains(steps.what.outputs.what, 'places') || steps.what.outputs.what == 'both'
        run: npm run data:featured
        continue-on-error: true
      - name: Build stories
        if: contains(steps.what.outputs.what, 'stories') || steps.what.outputs.what == 'both'
        run: npm run data:stories
        continue-on-error: true
      - name: Read private ferry operators' timetables (weekly; skipped until 6 days since the last read)
        run: npm run data:operators
        continue-on-error: true
        env:
          FORCE: ${{ (contains(steps.what.outputs.what, 'operators') || steps.what.outputs.what == 'both') && github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Validate data (fails → nothing is committed or deployed)
        run: npm run validate:data
      - name: Commit data
        id: commit
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          for f in data/events.json data/stories.json data/events-log.json data/event-venues.geojson data/venue-geocode.json data/places-auto.geojson data/timetables-turyol.json data/timetables-dentur.json data/operators-log.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."
          else
            git commit -m "Data refresh ($(date -u +%F)): ${{ steps.what.outputs.what }}"
            # someone may have pushed while we scraped: replay our data commit on top and retry
            for i in 1 2 3; do
              git pull --rebase -q origin phase-0 && git push origin HEAD:phase-0 && break
              sleep $((i * 10))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: phase-0
